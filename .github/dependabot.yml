version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'Npgsql.*']
      testing:
        patterns: ['xunit*', 'Reqnroll*', 'Shouldly', 'NetArchTest*', 'coverlet*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
