version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'Npgsql.*']
      testing:
        patterns: ['xunit*', 'Reqnroll*', 'Shouldly', 'NetArchTest*', 'coverlet*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Types must match the Node.js version CI and the Docker image run (24).
      # Raise this together with the Node.js version, not on its own.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Major .NET and Node.js upgrades are planned changes (global.json, CI, docs), not automatic bumps.
      - dependency-name: dotnet/sdk
        update-types: ['version-update:semver-major']
      - dependency-name: dotnet/aspnet
        update-types: ['version-update:semver-major']
      - dependency-name: node
        update-types: ['version-update:semver-major']
