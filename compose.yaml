# Orbs with PostgreSQL. Start: docker compose up -d   Then open http://localhost:8080
# Settings come from .env (copy .env.example). Only the database is required.
name: orbs

services:
  orbs:
    build: .
    image: ghcr.io/stijntersteege/orbs:latest
    restart: unless-stopped
    ports:
      - "${ORBS_PORT:-8080}:8080"
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Orbs: "Host=db;Database=orbs;Username=orbs;Password=${POSTGRES_PASSWORD:-orbs}"
      Orbs__ApiToken: "${ORBS_API_TOKEN:-}"
      Orbs__PublicUrl: "${ORBS_PUBLIC_URL:-http://localhost:8080}"
      Orbs__TrustForwardedHeaders: "${ORBS_TRUST_FORWARDED_HEADERS:-false}"
      Orbs__Auth__Oidc__Authority: "${ORBS_OIDC_AUTHORITY:-}"
      Orbs__Auth__Oidc__ClientId: "${ORBS_OIDC_CLIENT_ID:-}"
      Orbs__Auth__Oidc__ClientSecret: "${ORBS_OIDC_CLIENT_SECRET:-}"
      Orbs__Auth__Oidc__DisplayName: "${ORBS_OIDC_DISPLAY_NAME:-Single sign-on}"
      Orbs__SeedDemoData: "${ORBS_SEED_DEMO_DATA:-true}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbs
      POSTGRES_USER: orbs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-orbs}"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed for local development (dotnet run against Postgres). Remove in production.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbs -d orbs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
